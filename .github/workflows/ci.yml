name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      TURBO_CONCURRENCY: 2
      VITEST_MAX_WORKERS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm gate
